events {}

http {
  # JSON-лог в stdout, чтобы Docker → GELF → Logstash его увидел
  log_format json escape=json
    '{ "time":"$time_iso8601", "remote_addr":"$remote_addr", "host":"$host",'
    '  "request":"$request", "status":$status, "request_time":$request_time,'
    '  "body_bytes_sent":$body_bytes_sent, "request_length":$request_length,'
    '  "upstream_addr":"$upstream_addr", "upstream_status":"$upstream_status",'
    '  "upstream_response_time":"$upstream_response_time",'
    '  "x_request_id_in":"$http_x_request_id",'
    '  "x_request_id_upstream":"$upstream_http_x_request_id" }';
  access_log /dev/stdout json;
  error_log  /dev/stderr info;

  server {
    listen 80;
    server_name _;

    location /api/service-1/ {
      proxy_set_header X-Request-Id $http_x_request_id;  # прокидываем ID, если пришёл
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://service_1:3000/;
    }

    location /api/service-2/ {
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://service_2:3001/;
    }
  }
}
