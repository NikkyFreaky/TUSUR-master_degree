services:
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [lab4-net]
    labels:
      app: "lab4"
      service: "gateway"
      env: "dev"
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201" # было udp://logstash:12201
        tag: "gateway" # укажи свой тег: service_1 / service_2 / gateway
        labels: "app,service,env"
        env: "NODE_ENV,LOG_LEVEL"

networks:
  lab4-net:
    external: true
